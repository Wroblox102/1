<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W Roblox — Script Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f6; 
    --bg-2: #ffffff; 
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --border: #e5e7eb; 
    --border-hover: #8b5cf6;
    
    --text: #111827; 
    --text-dim: #4b5563;
    --text-mute: #9ca3af;
    
    --primary: #8b5cf6;
    --primary-2: #6366f1;
    --accent: #0ea5e9; 
    --success: #10b981;
    
    --gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #22d3ee 100%);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Inter', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(34, 211, 238, 0.08) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    background: rgba(255, 255, 255, 0.85);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
    will-change: backdrop-filter;
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 20px; letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 38px; height: 38px;
    background: var(--gradient);
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 20px; color: white;
    position: relative;
  }
  .logo-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
    opacity: 0;
    animation: pulseOpacity 3s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes pulseOpacity {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.05); }
  }

  .logo-text .accent {
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* AVATAR TRÊN NAV */
  .user-profile { display: flex; align-items: center; gap: 12px; }
  .avatar-container {
    position: relative; width: 42px; height: 42px;
    border-radius: 50%; padding: 2px;
    background: var(--gradient);
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }
  .avatar-container:hover { transform: scale(1.08); box-shadow: 0 0 20px rgba(139, 92, 246, 0.6); }
  .user-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #ffffff; display: block; }
  .status-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 10px; height: 10px; background-color: var(--success);
    border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 8px var(--success);
  }

  /* HUB PROFILE HEADER (PHẦN ĐẦU TRANG MỚI) */
  .hub-header {
    max-width: 1300px; margin: 0 auto;
    padding: 50px 40px 30px; 
    display: flex; align-items: center; gap: 24px;
    flex-wrap: wrap;
  }
  
  .hub-avatar {
    width: 100px; height: 100px;
    border-radius: 50%; padding: 3px;
    background: var(--gradient);
    box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
    flex-shrink: 0;
  }
  .hub-avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    border: 3px solid #ffffff;
  }

  .hub-info h1 {
    font-size: 36px; font-weight: 900; letter-spacing: -1px;
    margin-bottom: 8px; color: var(--text);
  }
  .hub-info h1 span {
    background: var(--gradient); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hub-info p {
    font-size: 15px; color: var(--text-dim); line-height: 1.5; max-width: 600px;
  }

  /* SEARCH & SUGGESTIONS */
  .search-section {
    max-width: 1300px; margin: 0 auto 30px; padding: 0 40px; position: relative;
    z-index: 90; 
  }
  .search-wrapper {
    position: relative; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 4px; transition: border-color 0.3s, box-shadow 0.3s; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    max-width: 600px; /* Thu gọn thanh tìm kiếm cho đẹp */
  }
  .search-wrapper:focus-within {
    border-color: var(--border-hover); box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
  }
  .search-wrapper input {
    width: 100%; padding: 14px 50px 14px 20px;
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px; font-family: inherit;
  }
  .search-wrapper input::placeholder { color: var(--text-mute); }
  .search-icon {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    color: var(--text-mute); font-size: 18px; pointer-events: none;
  }

  /* DROPDOWN GỢI Ý */
  .suggestions {
    position: absolute; top: 100%; left: 40px; width: 600px; max-width: calc(100% - 80px);
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 12px; margin-top: 8px;
    max-height: 250px; overflow-y: auto; z-index: 90;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    opacity: 0; visibility: hidden;
    transform: translateY(-10px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  .suggestions.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .suggestion-item {
    padding: 14px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); transition: background-color 0.2s;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--surface-2); }
  .suggestion-item img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
  .suggestion-item span { font-size: 14px; font-weight: 600; color: var(--text); }
  .suggestion-item small { color: var(--text-mute); font-size: 12px; margin-left: auto; }

  /* GRID */
  .scripts-grid {
    max-width: 1300px; margin: 0 auto; padding: 0 40px 80px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  /* CARD */
  .card {
    background: var(--bg-2); 
    border: 1px solid var(--border);
    border-radius: 20px; padding: 0; position: relative;
    display: flex; flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease;
    will-change: transform;
  }
  
  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 20px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: -1;
  }

  .card:hover {
    transform: translateY(-4px); 
    border-color: var(--border-hover);
  }
  .card:hover::before { opacity: 1; }

  /* ẢNH SCRIPT (Thu nhỏ lại thành Thumbnail) */
  .card-image {
    width: 100%; height: 140px; background: #f1f5f9; overflow: hidden; position: relative;
    border-bottom: 1px solid var(--border);
    border-radius: 19px 19px 0 0;
  }
  .card-image img {
    width: 100%; height: 100%; object-fit: cover; 
    transition: transform 0.4s ease;
  }
  .card:hover .card-image img { transform: scale(1.05); }

  /* NỘI DUNG CARD */
  .card-content {
    padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1;
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .card-title-wrap { display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.2; }
  .card-category {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px;
  }
  
  /* NÚT LINK CHÍNH / PHỤ */
  .card-actions { display: flex; gap: 10px; margin-top: auto; }
  .btn {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid transparent;
    font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    will-change: transform;
  }
  .btn-main {
    background: var(--gradient); color: white;
    box-shadow: 0 4px 10px rgba(139, 92, 246, 0.25);
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(139, 92, 246, 0.4); }
  
  .btn-sub {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  }
  .btn-sub:hover { border-color: var(--border-hover); background: #f3f4f6; color: var(--primary); }

  /* EMPTY */
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-mute);
  }
  .empty-icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }

  /* NÚT NHẠC */
  .music-btn {
    position: fixed; bottom: 30px; right: 30px;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text); font-size: 22px; cursor: pointer;
    display: grid; place-items: center; z-index: 1000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    will-change: transform;
  }
  .music-btn:hover { transform: scale(1.1); border-color: var(--border-hover); color: var(--primary); }
  .music-btn.playing {
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); border-color: var(--primary); color: var(--primary);
    animation: rotateMusic 4s linear infinite;
  }
  @keyframes rotateMusic { 
    from { transform: rotate(0deg); } 
    to { transform: rotate(360deg); } 
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 768px) {
    nav { 
      padding: 14px 20px; 
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(255, 255, 255, 0.98);
    }
    .hub-header {
      padding: 30px 20px 20px;
      flex-direction: column; text-align: center; gap: 16px;
    }
    .hub-avatar { width: 80px; height: 80px; }
    .hub-info h1 { font-size: 28px; }
    
    .search-section { padding: 0 20px; }
    .search-wrapper { max-width: 100%; }
    .suggestions { left: 20px; right: 20px; width: auto; max-width: none; }
    
    .scripts-grid { padding: 0 15px 60px; gap: 12px; }
    
    .card { border-radius: 14px; }
    .card::before { border-radius: 14px; }
    
    .card-image { height: 100px; border-radius: 13px 13px 0 0; }
    .card-content { padding: 12px; gap: 10px; }
    
    .card-title { font-size: 14px; }
    .card-category { font-size: 9px; }
    
    .card-actions { flex-direction: column; gap: 6px; }
    .btn { padding: 8px; font-size: 11px; border-radius: 8px; }
    
    .music-btn { bottom: 20px; right: 20px; width: 45px; height: 45px; }
  }
</style>
</head>
<body>

<!-- NHẠC NỀN -->
<audio id="bgMusic" loop playsinline preload="auto">
  <source src="nhac.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" id="musicToggle" title="Bật/Tắt nhạc">
  <span id="musicIcon">🔇</span>
</button>

<nav>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">W <span class="accent">Roblox</span></div>
  </div>
  <div class="user-profile">
    <div class="avatar-container">
      <img src="https://i.ibb.co/8DYn3j1L/2-F9-D1447-5-BB1-4-D2-D-AF83-1990628-FA41-C.png" alt="Avatar" class="user-avatar">
      <span class="status-dot"></span>
    </div>
  </div>
</nav>

<!-- PHẦN HEADER HUB MỚI -->
<section class="hub-header">
  <div class="hub-avatar">
    <img src="https://i.ibb.co/8DYn3j1L/2-F9-D1447-5-BB1-4-D2-D-AF83-1990628-FA41-C.png" alt="W Roblox Hub">
  </div>
  <div class="hub-info">
    <h1><span>W Roblox</span> Hub</h1>
    <p>Tổng hợp các Script Roblox chất lượng cao, hoạt động tốt nhất. Cập nhật liên tục và hoàn toàn miễn phí dành cho cộng đồng.</p>
  </div>
</section>

<div class="search-section">
  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Tìm tên Script..." autocomplete="off">
    <span class="search-icon">🔍</span>
  </div>
  <div class="suggestions" id="suggestions"></div>
</div>

<main class="scripts-grid" id="grid"></main>

<script>
  // ================= DỮ LIỆU SCRIPT =================
  const defaultImage = "https://i.ibb.co/8DYn3j1L/2-F9-D1447-5-BB1-4-D2-D-AF83-1990628-FA41-C.png"; 

  const scripts = [
    {
      id: 1, name: "Speed Hack Pro", category: "speed",
      image: defaultImage, linkMain: "#", linkSub: "#"
    },
    {
      id: 2, name: "Mega Jump", category: "jump",
      image: defaultImage, linkMain: "#", linkSub: "#"
    },
    {
      id: 3, name: "Advanced ESP", category: "esp",
      image: defaultImage, linkMain: "#", linkSub: "#"
    },
    {
      id: 4, name: "Auto Farm Ultimate", category: "auto",
      image: defaultImage, linkMain: "#", linkSub: "#"
    },
    {
      id: 5, name: "Fly V3", category: "tool",
      image: defaultImage, linkMain: "#", linkSub: "#"
    },
    {
      id: 6, name: "Infinite Yield", category: "tool",
      image: defaultImage, linkMain: "#", linkSub: "#"
    }
  ];

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const suggestionsBox = document.getElementById('suggestions');
  let currentSearch = '';

  // ================= XỬ LÝ NHẠC NỀN =================
  const bgMusic = document.getElementById('bgMusic');
  const musicToggle = document.getElementById('musicToggle');
  const musicIcon = document.getElementById('musicIcon');
  
  let isMutedByUser = false; 

  bgMusic.volume = 0.4; 

  function attemptPlay() {
    if (isMutedByUser) return; 

    bgMusic.play().then(() => {
      musicIcon.textContent = '🎵';
      musicToggle.classList.add('playing');
      document.removeEventListener('click', initAudio);
      document.removeEventListener('touchstart', initAudio);
    }).catch(() => {});
  }

  function initAudio(e) {
    if (musicToggle.contains(e.target)) return;
    attemptPlay();
  }

  document.addEventListener('click', initAudio);
  document.addEventListener('touchstart', initAudio);

  musicToggle.addEventListener('click', (e) => {
    e.stopPropagation(); 
    if (bgMusic.paused) {
      isMutedByUser = false;
      bgMusic.play().then(() => {
        musicIcon.textContent = '🎵';
        musicToggle.classList.add('playing');
      });
    } else {
      isMutedByUser = true;
      bgMusic.pause();
      musicIcon.textContent = '🔇';
      musicToggle.classList.remove('playing');
    }
  });

  // ================= RENDER SCRIPT =================
  function renderScripts() {
    const filtered = scripts.filter(s => {
      return s.name.toLowerCase().includes(currentSearch);
    });

    grid.innerHTML = '';

    if (!filtered.length) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <h3>Không tìm thấy script</h3>
          <p>Thử tìm với từ khóa khác</p>
        </div>`;
      return;
    }

    filtered.forEach((s, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animation = `fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) ${idx * 0.05}s backwards`;
      
      card.innerHTML = `
        <div class="card-image">
          <img src="${s.image}" alt="${s.name}" loading="lazy">
        </div>
        <div class="card-content">
          <div class="card-header">
            <div class="card-title-wrap">
              <div class="card-title">${s.name}</div>
              <div class="card-category">${s.category.toUpperCase()}</div>
            </div>
          </div>
          <div class="card-actions">
            <a href="${s.linkMain}" target="_blank" class="btn btn-main">🔗 Link Chính</a>
            <a href="${s.linkSub}" target="_blank" class="btn btn-sub">📁 Link Phụ</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // ================= GỢI Ý TÌM KIẾM =================
  searchInput.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    currentSearch = val;
    renderScripts();

    suggestionsBox.innerHTML = '';
    if (val.length > 0) {
      const matches = scripts.filter(s => s.name.toLowerCase().includes(val));
      
      if (matches.length > 0) {
        matches.forEach(m => {
          const item = document.createElement('div');
          item.className = 'suggestion-item';
          item.innerHTML = `
            <img src="${m.image}" alt="${m.name}" loading="lazy">
            <span>${m.name}</span>
            <small>${m.category}</small>
          `;
          item.addEventListener('click', () => {
            searchInput.value = m.name;
            currentSearch = m.name.toLowerCase();
            renderScripts();
            suggestionsBox.classList.remove('show');
          });
          suggestionsBox.appendChild(item);
        });
        suggestionsBox.classList.add('show');
      } else {
        suggestionsBox.classList.remove('show');
      }
    } else {
      suggestionsBox.classList.remove('show');
    }
  });

  document.addEventListener('click', (e) => {
    if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
      suggestionsBox.classList.remove('show');
    }
  });

  searchInput.addEventListener('focus', () => {
    if (searchInput.value.trim().length > 0) {
      suggestionsBox.classList.add('show');
    }
  });

  const style = document.createElement('style');
  style.textContent = `
    @keyframes fadeIn {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
  `;
  document.head.appendChild(style);

  renderScripts();
</script>

</body>
</html>
